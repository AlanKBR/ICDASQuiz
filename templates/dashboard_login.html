{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Área do professor · ICDASQuiz{% endblock %}
{% block content %}
<section class="professor-login">
  <span class="kick">Acesso restrito</span><h1>Área do professor</h1>
  <form action="{{ url_for('dashboard_login') }}" method="post">
    {{ csrf() }}
    <label class="sr-only" for="professor-password">Senha</label>
    <input id="professor-password" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
    {% if mensagem %}<p class="form-alert" role="alert">{{ mensagem }}</p>{% endif %}
    <button class="go" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
